<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reportar Bug — Bolão Kebolets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #1a7a3c; --green-dark: #125a2b; --green-light: #e8f5ed;
    --gold: #f0b429; --gold-dark: #b8871a;
    --white: #ffffff; --gray-50: #f9f9f7; --gray-100: #f0eeea; --gray-200: #dddbd5;
    --gray-400: #9b9891; --gray-700: #3d3c38; --gray-900: #1a1917;
    --radius: 12px; --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Barlow', sans-serif; background: var(--gray-50); color: var(--gray-900); min-height: 100vh; }
  header { background: linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%); padding: 1.75rem 1rem; text-align: center; }
  header h1 { font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 800; color: var(--gold); letter-spacing: 0.02em; }
  header p { color: rgba(255,255,255,0.85); font-size: 13px; margin-top: 4px; }
  main { max-width: 560px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
  .card { background: var(--white); border-radius: var(--radius); border: 1px solid var(--gray-200); padding: 1.25rem; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--gray-700); margin-bottom: 6px; margin-top: 1.1rem; }
  label:first-of-type { margin-top: 0; }
  input[type="text"], textarea {
    width: 100%; border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm);
    padding: 11px 13px; font-size: 15px; font-family: inherit; color: var(--gray-900);
    background: var(--gray-50); transition: border-color 0.15s;
  }
  input[type="text"]:focus, textarea:focus { outline: none; border-color: var(--green); background: var(--white); }
  textarea { resize: vertical; min-height: 110px; line-height: 1.45; }
  .hint { font-size: 12px; color: var(--gray-400); margin-top: 4px; }
  .upload-zone {
    border: 1.5px dashed var(--gray-200); border-radius: var(--radius-sm);
    padding: 1.25rem; text-align: center; cursor: pointer; background: var(--gray-50);
    transition: border-color 0.15s, background 0.15s;
  }
  .upload-zone:hover, .upload-zone.dragover { border-color: var(--green); background: var(--green-light); }
  .upload-zone svg { width: 28px; height: 28px; color: var(--gray-400); margin-bottom: 6px; }
  .upload-zone p { font-size: 13px; color: var(--gray-700); font-weight: 600; }
  .upload-zone span { font-size: 12px; color: var(--gray-400); }
  #file-input { display: none; }
  .previews { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .preview-item { position: relative; width: 72px; height: 72px; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--gray-200); }
  .preview-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .preview-remove {
    position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 50%;
    background: rgba(0,0,0,0.65); color: white; border: none; font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; line-height: 1;
  }
  button[type="submit"] {
    width: 100%; margin-top: 1.5rem; background: var(--green); color: white; border: none;
    border-radius: var(--radius-sm); padding: 13px; font-size: 15px; font-weight: 700;
    font-family: inherit; cursor: pointer; transition: background 0.15s;
  }
  button[type="submit"]:hover:not(:disabled) { background: var(--green-dark); }
  button[type="submit"]:disabled { background: var(--gray-200); color: var(--gray-400); cursor: not-allowed; }
  .back-link {
    display: inline-flex; align-items: center; gap: 6px; color: var(--gray-700); font-size: 14px;
    font-weight: 600; text-decoration: none; margin-bottom: 1rem;
  }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--gray-900); color: white; padding: 12px 20px; border-radius: var(--radius-sm);
    font-size: 14px; font-weight: 600; opacity: 0; transition: opacity 0.25s, transform 0.25s; z-index: 100;
    max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: #b91c1c; }
  .success-screen { text-align: center; padding: 2.5rem 1rem; }
  .success-screen .check {
    width: 64px; height: 64px; border-radius: 50%; background: var(--green-light); color: var(--green);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem; font-size: 32px;
  }
  .success-screen h2 { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; margin-bottom: 8px; }
  .success-screen p { color: var(--gray-700); font-size: 14px; margin-bottom: 1.5rem; }
  .success-screen a {
    display: inline-block; background: var(--green); color: white; text-decoration: none;
    padding: 11px 22px; border-radius: var(--radius-sm); font-weight: 700; font-size: 14px;
  }
</style>
</head>
<body>
<header>
  <h1>🐛 Reportar Bug</h1>
  <p>Bolão Kebolets — Copa 2026</p>
</header>
<main>
  <a href="index.html" class="back-link">← Voltar ao bolão</a>

  <div class="card" id="form-card">
    <div id="user-badge" style="display:none;font-size:13px;color:var(--gray-400);margin-bottom:1rem;">Reportando como <strong id="user-badge-name" style="color:var(--gray-700);"></strong></div>
    <form id="bug-form">
      <label for="titulo">Título do bug</label>
      <input type="text" id="titulo" placeholder="Ex: Placar não atualiza" maxlength="120" required>

      <label for="descricao">Descrição</label>
      <textarea id="descricao" placeholder="Descreva o que aconteceu, o que você esperava ver, e em qual tela/jogo ocorreu." required></textarea>

      <label>Prints (opcional)</label>
      <div class="upload-zone" id="upload-zone">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 13.5l3-3m0 0l3 3m-3-3v6m-1.5-15H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
        <p>Toque para anexar imagens</p>
        <span>PNG, JPG — várias imagens permitidas</span>
      </div>
      <input type="file" id="file-input" accept="image/*" multiple>
      <div class="previews" id="previews"></div>

      <button type="submit" id="submit-btn">Enviar report</button>
    </form>
  </div>

  <div class="card success-screen" id="success-card" style="display:none;">
    <div class="check">✓</div>
    <h2>Bug reportado!</h2>
    <p>Obrigado por ajudar a melhorar o bolão. Vamos analisar o quanto antes.</p>
    <a href="index.html">Voltar ao bolão</a>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://yciqdafnvcxrxgkwltxy.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InljaXFkYWZudmN4cnhna3dsdHh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExODI4MjIsImV4cCI6MjA5Njc1ODgyMn0.cZtvIIuPYMteHrqHjRlzLw9dU8bUeVr4LCOVvhVTxqw';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let selectedFiles = [];

const storedName = localStorage.getItem('bolao_kebolets_nome');
if (storedName) {
  document.getElementById('user-badge').style.display = 'block';
  document.getElementById('user-badge-name').textContent = storedName;
}

const uploadZone = document.getElementById('upload-zone');
const fileInput = document.getElementById('file-input');
const previewsEl = document.getElementById('previews');

uploadZone.addEventListener('click', () => fileInput.click());

uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});

fileInput.addEventListener('change', () => handleFiles(fileInput.files));

function handleFiles(files) {
  for (const file of files) {
    if (!file.type.startsWith('image/')) continue;
    selectedFiles.push(file);
  }
  renderPreviews();
}

function renderPreviews() {
  previewsEl.innerHTML = '';
  selectedFiles.forEach((file, i) => {
    const url = URL.createObjectURL(file);
    const div = document.createElement('div');
    div.className = 'preview-item';
    div.innerHTML = `<img src="${url}"><button type="button" class="preview-remove" data-i="${i}">✕</button>`;
    previewsEl.appendChild(div);
  });
  previewsEl.querySelectorAll('.preview-remove').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedFiles.splice(parseInt(btn.dataset.i), 1);
      renderPreviews();
    });
  });
}

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => { t.className = 'toast'; }, 3500);
}

document.getElementById('bug-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Enviando...';

  const titulo = document.getElementById('titulo').value.trim();
  const descricao = document.getElementById('descricao').value.trim();
  const nome = localStorage.getItem('bolao_kebolets_nome') || null;

  try {
    const imageUrls = [];
    for (const file of selectedFiles) {
      const ext = file.name.split('.').pop() || 'png';
      const path = `bugs/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
      const { error: upErr } = await sb.storage.from('bug-screenshots').upload(path, file);
      if (upErr) { console.error(upErr); continue; }
      const { data: urlData } = sb.storage.from('bug-screenshots').getPublicUrl(path);
      imageUrls.push(urlData.publicUrl);
    }

    const { error } = await sb.from('bug_reports').insert({
      titulo, descricao, nome: nome || null,
      imagens: imageUrls.length ? imageUrls : null,
      status: 'aberto',
      criado_em: new Date().toISOString()
    });

    if (error) throw error;

    document.getElementById('form-card').style.display = 'none';
    document.getElementById('success-card').style.display = 'block';
  } catch (err) {
    console.error(err);
    showToast('Erro ao enviar. Tenta de novo!', true);
    btn.disabled = false;
    btn.textContent = 'Enviar report';
  }
});
</script>
</body>
</html>
