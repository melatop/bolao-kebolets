<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil — Bolão Kebolets</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #1a7a3c; --green-dark: #125a2b; --green-light: #e8f5ed;
    --gold: #f0b429; --white: #ffffff; --gray-50: #f9f9f7; --gray-100: #f0eeea;
    --gray-200: #dddbd5; --gray-400: #9b9891; --gray-700: #3d3c38; --gray-900: #1a1917;
    --radius: 12px; --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Barlow', sans-serif; background: var(--gray-100); color: var(--gray-900); min-height: 100vh; }
  header { background: linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%); padding: 1.25rem 1rem; text-align: center; }
  header h1 { font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 800; color: var(--gold); text-transform: uppercase; }
  main { max-width: 480px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
  .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--gray-700); font-size: 14px; font-weight: 600; text-decoration: none; margin-bottom: 1rem; }
  .card { background: var(--white); border-radius: var(--radius); border: 1px solid var(--gray-200); padding: 1.5rem; margin-bottom: 1rem; }
  .avatar-section { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 1.5rem; }
  .avatar-wrap { position: relative; width: 96px; height: 96px; }
  .avatar-img { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 3px solid var(--green-light); background: var(--gray-100); display: block; }
  .avatar-placeholder { width: 96px; height: 96px; border-radius: 50%; background: var(--green); display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 800; color: var(--gold); border: 3px solid var(--green-light); }
  .avatar-edit-btn { position: absolute; bottom: 2px; right: 2px; width: 28px; height: 28px; border-radius: 50%; background: var(--green); border: 2px solid var(--white); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; }
  .username { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; color: var(--gray-900); }
  .username-hint { font-size: 12px; color: var(--gray-400); }
  .field-label { display: block; font-size: 13px; font-weight: 600; color: var(--gray-700); margin-bottom: 8px; }
  .time-list { border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm); overflow-y: scroll; height: 220px; }
  .time-item { display: flex; align-items: center; gap: 10px; padding: 10px 13px; cursor: pointer; border-bottom: 1px solid var(--gray-100); transition: background 0.1s; }
  .time-item:last-child { border-bottom: none; }
  .time-item:hover { background: var(--gray-50); }
  .time-item.selected { background: var(--green-light); }
  .time-item.selected .time-nome { color: var(--green); }
  .time-logo { width: 28px; height: 28px; object-fit: contain; flex-shrink: 0; }
  .time-nome { font-size: 14px; font-weight: 600; color: var(--gray-700); }
  button[type="submit"] { width: 100%; margin-top: 1.5rem; background: var(--green); color: white; border: none; border-radius: var(--radius-sm); padding: 13px; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; }
  button[type="submit"]:disabled { background: var(--gray-200); color: var(--gray-400); cursor: not-allowed; }
  #file-input { display: none; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--gray-900); color: white; padding: 12px 20px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; opacity: 0; transition: opacity 0.25s, transform 0.25s; z-index: 100; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.success { background: var(--green); }
</style>
</head>
<body>
<header><h1>👤 Meu Perfil</h1></header>
<main>
  <a href="index.html" class="back-link">← Voltar ao bolão</a>
  <div id="loading-perfil" style="text-align:center;padding:2rem;color:var(--gray-400);">Carregando...</div>
  <div id="perfil-content" style="display:none;">
    <div class="card">
      <div class="avatar-section">
        <div class="avatar-wrap" id="avatar-wrap">
          <div class="avatar-placeholder" id="avatar-placeholder"></div>
          <div class="avatar-edit-btn" onclick="document.getElementById('file-input').click()">✏️</div>
        </div>
        <div style="text-align:center;">
          <div class="username" id="username-display"></div>
          <div class="username-hint">Nome de usuário · não editável</div>
        </div>
      </div>
      <input type="file" id="file-input" accept="image/*">
    </div>

    <div class="card">
      <form id="perfil-form">
        <span class="field-label">⚽ Time do coração</span>
        <div class="time-list" id="time-list"></div>
        <input type="hidden" id="time-selected" value="">
        <button type="submit" id="save-btn">Salvar perfil</button>
      </form>
    </div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://yciqdafnvcxrxgkwltxy.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InljaXFkYWZudmN4cnhna3dsdHh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExODI4MjIsImV4cCI6MjA5Njc1ODgyMn0.cZtvIIuPYMteHrqHjRlzLw9dU8bUeVr4LCOVvhVTxqw';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const TIMES = [
  { nome: 'Atlético Mineiro',    cor: '#000000', cor2: '#FFFFFF', sigla: 'CAM' },
  { nome: 'Athletico Paranaense',cor: '#CC0000', cor2: '#000000', sigla: 'CAP' },
  { nome: 'Bahia',               cor: '#005BAC', cor2: '#EF3E42', sigla: 'BAH' },
  { nome: 'Botafogo',            cor: '#000000', cor2: '#FFFFFF', sigla: 'BOT' },
  { nome: 'Chapecoense',         cor: '#00753B', cor2: '#FFFFFF', sigla: 'CHP' },
  { nome: 'Corinthians',         cor: '#000000', cor2: '#FFFFFF', sigla: 'COR' },
  { nome: 'Coritiba',            cor: '#006600', cor2: '#FFFFFF', sigla: 'CTB' },
  { nome: 'Cruzeiro',            cor: '#003087', cor2: '#FFFFFF', sigla: 'CRU' },
  { nome: 'Flamengo',            cor: '#CC0000', cor2: '#000000', sigla: 'FLA' },
  { nome: 'Fluminense',          cor: '#6B1A27', cor2: '#008B45', sigla: 'FLU' },
  { nome: 'Grêmio',              cor: '#0066CC', cor2: '#000000', sigla: 'GRE' },
  { nome: 'Internacional',       cor: '#CC0000', cor2: '#FFFFFF', sigla: 'INT' },
  { nome: 'Mirassol',            cor: '#FFD700', cor2: '#000080', sigla: 'MIR' },
  { nome: 'Palmeiras',           cor: '#006600', cor2: '#FFFFFF', sigla: 'PAL' },
  { nome: 'RB Bragantino',       cor: '#CC0000', cor2: '#FFFFFF', sigla: 'RBB' },
  { nome: 'Remo',                cor: '#003087', cor2: '#FFFFFF', sigla: 'REM' },
  { nome: 'Santos',              cor: '#000000', cor2: '#FFFFFF', sigla: 'SAN' },
  { nome: 'São Paulo',           cor: '#CC0000', cor2: '#000000', sigla: 'SPF' },
  { nome: 'Vasco da Gama',       cor: '#000000', cor2: '#FFFFFF', sigla: 'VAS' },
  { nome: 'Vitória',             cor: '#CC0000', cor2: '#000000', sigla: 'VIT' },
].sort((a, b) => a.nome.localeCompare(b.nome));

function escudoSVG(time, size = 28) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;">
    <path d="M14 2 L24 6 L24 16 Q24 22 14 26 Q4 22 4 16 L4 6 Z" fill="${time.cor}" stroke="${time.cor2}" stroke-width="1.5"/>
    <text x="14" y="17" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" font-weight="bold" fill="${time.cor2}">${time.sigla.substring(0,3)}</text>
  </svg>`;
}

const nome = localStorage.getItem('bolao_kebolets_nome');
let perfilAtual = {};
let novaFoto = null;

if (!nome) window.location.href = 'index.html';

function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(() => { t.className = 'toast'; }, 3000);
}

function setAvatar(url) {
  const wrap = document.getElementById('avatar-wrap');
  const existing = wrap.querySelector('img.avatar-img');
  if (url) {
    if (existing) { existing.src = url; return; }
    const ph = document.getElementById('avatar-placeholder');
    if (ph) ph.remove();
    const img = document.createElement('img');
    img.className = 'avatar-img';
    img.src = url;
    wrap.insertBefore(img, wrap.querySelector('.avatar-edit-btn'));
  } else {
    document.getElementById('avatar-placeholder').textContent = nome.charAt(0);
  }
}

function buildTimeList(selectedTime) {
  const list = document.getElementById('time-list');
  list.innerHTML = '';
  TIMES.forEach(t => {
    const item = document.createElement('div');
    item.className = 'time-item' + (t.nome === selectedTime ? ' selected' : '');
    item.innerHTML = `${escudoSVG(t)}<span class="time-nome">${t.nome}</span>`;
    item.addEventListener('click', () => {
      document.querySelectorAll('.time-item').forEach(el => el.classList.remove('selected'));
      item.classList.add('selected');
      document.getElementById('time-selected').value = t.nome;
    });
    list.appendChild(item);
  });
  if (selectedTime) {
    const sel = list.querySelector('.selected');
    if (sel) sel.scrollIntoView({ block: 'nearest' });
  }
}

async function init() {
  document.getElementById('username-display').textContent = nome;

  const { data } = await sb.from('perfis').select('*').eq('nome', nome).maybeSingle();
  if (data) {
    perfilAtual = data;
    setAvatar(data.foto_url || null);
    document.getElementById('time-selected').value = data.time_coracao || '';
    buildTimeList(data.time_coracao || '');
  } else {
    setAvatar(null);
    buildTimeList('');
  }

  document.getElementById('loading-perfil').style.display = 'none';
  document.getElementById('perfil-content').style.display = 'block';
}

document.getElementById('file-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  novaFoto = file;
  setAvatar(URL.createObjectURL(file));
});

document.getElementById('perfil-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  btn.textContent = 'Salvando...';
  try {
    let foto_url = perfilAtual.foto_url || null;
    if (novaFoto) {
      const ext = novaFoto.name.split('.').pop() || 'jpg';
      const path = `${nome.toLowerCase()}.${ext}`;
      const { error: upErr } = await sb.storage.from('fotos-perfil').upload(path, novaFoto, { upsert: true });
      if (upErr) throw upErr;
      const { data: urlData } = sb.storage.from('fotos-perfil').getPublicUrl(path);
      foto_url = urlData.publicUrl + '?t=' + Date.now();
    }
    const time_coracao = document.getElementById('time-selected').value || null;
    const { error } = await sb.from('perfis').upsert({ nome, time_coracao, foto_url, atualizado_em: new Date().toISOString() }, { onConflict: 'nome' });
    if (error) throw error;
    perfilAtual = { nome, time_coracao, foto_url };
    novaFoto = null;
    showToast('Perfil salvo!', 'success');
  } catch (err) {
    console.error(err);
    showToast('Erro ao salvar. Tenta de novo!');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Salvar perfil';
  }
});

init();
</script>
</body>
</html>
